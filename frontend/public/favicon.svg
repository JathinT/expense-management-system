<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dollar">
  <!-- Background rounded square in brand teal -->
  <rect width="64" height="64" rx="10" fill="#0f766e" />
  <!-- White bold dollar sign, centered. Use a heavier weight to remain legible at small sizes. -->
  <text x="50%" y="52%" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="800" font-size="36" fill="#ffffff" dy="-2">$</text>
</svg>
